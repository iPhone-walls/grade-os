<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GRADE OS</title>
<meta name="theme-color" content="#070a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GRADE OS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: iOS-style liquid glass. One clear glass "NOW" slab floats over a vivid, switchable wallpaper; everything else is quieter glass. Single dark look by design. */
:root{
  color-scheme:dark;
  --base:#070a24; --m1:#6a5cff; --m2:#00c8ff; --m3:#ff5fa2; --m4:#ffd36e;
  --fg:#ffffff; --dim:rgba(255,255,255,.72); --faint:rgba(255,255,255,.5);
  --accent:#ffffff;
  --good:#6ff5b3; --warn:#ffd06b; --crit:#ff7d8e;
  --c-itm200:#6fdcff; --c-itm301:#c3a8ff; --c-pcs181:#ffd06b; --c-ecn503:#ff9cc4; --c-biz:#6ff5b3; --c-life:#e2e6ff;
  --display:ui-rounded,'SF Pro Rounded','Nunito',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Instrument Sans',system-ui,sans-serif;
  --r:34px;
}
body[data-bg="sunset"]{--base:#240a1c;--m1:#ff6a3d;--m2:#ff3d8b;--m3:#ffc15e;--m4:#8a4dff}
body[data-bg="ocean"]{--base:#02141f;--m1:#00c2c7;--m2:#2f7bff;--m3:#6ef3c5;--m4:#1b3bff}
body[data-bg="mono"]{--base:#0a0a0e;--m1:#5b6078;--m2:#a3a9c2;--m3:#2e3144;--m4:#d4d7e4}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--base);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.005em;transition:background .6s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:14px}

/* wallpaper */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--base);transition:background .6s}
.blob{position:absolute;border-radius:50%;filter:blur(38px);opacity:.95;animation:float 24s ease-in-out infinite alternate;transition:background .8s}
.b1{width:62vmax;height:62vmax;left:-20vmax;top:-22vmax;background:radial-gradient(circle at 40% 40%,var(--m1),transparent 68%)}
.b2{width:54vmax;height:54vmax;right:-18vmax;top:12vh;background:radial-gradient(circle at 50% 50%,var(--m2),transparent 66%);animation-duration:30s}
.b3{width:50vmax;height:50vmax;left:4vw;bottom:-22vmax;background:radial-gradient(circle at 50% 50%,var(--m3),transparent 66%);animation-duration:34s}
.b4{width:26vmax;height:26vmax;right:10vw;bottom:14vh;background:radial-gradient(circle,var(--m4),transparent 65%);animation-duration:20s;opacity:.8}
.ring{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);animation:float 40s ease-in-out infinite alternate-reverse}
.r1{width:46vmax;height:46vmax;left:-8vmax;top:26vh}
.r2{width:22vmax;height:22vmax;right:-4vmax;top:-4vmax;border-color:rgba(255,255,255,.12)}
.grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes float{to{transform:translate3d(5vmax,4vmax,0) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.blob,.ring{animation:none}}

/* liquid glass material */
.glass{position:relative;isolation:isolate;border-radius:var(--r);
  background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 42%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.12));
  -webkit-backdrop-filter:blur(20px) saturate(190%) brightness(1.06);backdrop-filter:blur(20px) saturate(190%) brightness(1.06);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -1px 1px rgba(255,255,255,.12),inset 0 0 24px rgba(255,255,255,.07),0 24px 60px -24px rgba(0,0,20,.55)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.25px;pointer-events:none;z-index:2;
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.14) 30%,rgba(255,255,255,.04) 60%,rgba(255,255,255,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(70% 45% at 18% 0%,rgba(255,255,255,.28),transparent 70%),radial-gradient(50% 30% at 90% 100%,rgba(255,255,255,.1),transparent 70%)}
.frost{position:relative;border-radius:20px;background:rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.1)}

.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 124px;display:flex;flex-direction:column;gap:16px;min-height:100%}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.02em;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.mark span{opacity:.6;font-weight:600}
.right{display:flex;align-items:center;gap:8px}
.stats{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.lvl{display:flex;flex-direction:column;gap:5px;min-width:108px;padding:7px 14px;border-radius:999px}
.lvl small{font-size:11px;color:var(--dim);font-weight:700;display:flex;gap:8px;justify-content:space-between;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8);transition:width .6s ease}
.round{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;flex-shrink:0}
.round svg{width:18px;height:18px}
.swatches{position:absolute;right:16px;top:64px;z-index:6;padding:14px;border-radius:26px;display:flex;flex-direction:column;gap:12px;max-width:calc(100% - 32px)}
.swrow{display:grid;grid-template-columns:repeat(4,58px);gap:10px 6px;max-height:min(56vh,420px);overflow-y:auto;padding:2px}
.swatches h3{margin:0;font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;padding-inline:2px}
.syncline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--dim);padding-top:10px;border-top:1px solid rgba(255,255,255,.14);max-width:262px}
.syncline .sdot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0}
.syncline[data-state="ok"] .sdot{background:var(--good);box-shadow:0 0 8px var(--good)}
.syncline[data-state="offline"] .sdot,.syncline[data-state="saving"] .sdot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.syncline span[data-sync-text]{flex:1;min-width:0}
.syncline button{border:0;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--fg)}
.syncline[data-state="local"] button{display:none}
.syncline[data-state="view"] .sdot,.syncline[data-state="needkey"] .sdot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.connect{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.swrow button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--dim);font-size:10.5px;font-weight:700;line-height:1.15;text-align:center}
.swrow button i{display:block;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 2px rgba(255,255,255,.6),0 6px 14px -6px rgba(0,0,0,.5)}
.swrow button[aria-pressed="true"]{color:#fff}
.swrow button[aria-pressed="true"] i{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.28),inset 0 1px 2px rgba(255,255,255,.6)}

/* NOW slab */
.now{padding:26px 22px 22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff}
.course{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.course b{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
h1.task{font-family:var(--display);font-weight:800;font-size:clamp(27px,7vw,36px);line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance;text-shadow:0 2px 20px rgba(0,0,30,.25)}
.why{color:var(--dim);font-size:15px;margin:0;max-width:60ch}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meta div{padding:11px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.meta small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700}
.meta strong{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}

.timer{display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0 2px}
.clock{font-family:var(--display);font-weight:700;font-size:clamp(68px,22vw,104px);letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:.95;text-shadow:0 4px 30px rgba(0,0,40,.3)}
.clock.ending{color:var(--warn)}
.track{width:100%;height:10px;border-radius:9px;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 2px rgba(0,0,0,.2);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:inherit;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.9)}

.rules{display:flex;flex-wrap:wrap;gap:6px}
.rules span{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:var(--dim)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{position:relative;border:0;border-radius:999px;padding:15px 18px;font-weight:700;font-size:16px;display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:54px;transition:transform .18s cubic-bezier(.3,1.6,.5,1),filter .15s}
.btn:active{transform:scale(.95)}
.btn.primary{grid-column:1/-1;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.82));color:#10122e;box-shadow:inset 0 -2px 6px rgba(0,0,40,.12),0 14px 30px -12px rgba(255,255,255,.6)}
.btn.done{background:linear-gradient(180deg,rgba(150,255,205,.95),rgba(80,230,160,.85));color:#03281a;box-shadow:inset 0 1px 1px rgba(255,255,255,.8),0 14px 30px -12px rgba(111,245,179,.7)}
.btn.ghost{background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.12);color:var(--fg)}
.btn.small{min-height:46px;padding:10px 16px;font-size:14.5px}

/* lists */
.section{display:flex;flex-direction:column;gap:9px}
.shead{display:flex;justify-content:space-between;align-items:baseline;padding-inline:6px}
.shead h2{margin:0;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;text-shadow:0 1px 12px rgba(0,0,0,.2)}
.shead span{font-size:12.5px;color:var(--faint);font-weight:600}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 14px}
.row .stripe{width:10px;height:10px;border-radius:50%;align-self:start;margin-top:5px;box-shadow:0 0 10px currentColor}
.row .t{font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap}
.row .end{display:flex;gap:6px;align-items:center}
.pill{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.crit{background:rgba(255,125,142,.24);color:#ffd0d6}
.pill.warn{background:rgba(255,208,107,.22);color:#ffe7b3}
.pill.ok{background:rgba(111,245,179,.2);color:var(--good)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);display:grid;place-items:center}
.icon-btn svg{width:17px;height:17px}
.icon-btn.on{background:rgba(111,245,179,.35);color:#fff}
.icon-btn.danger{color:#ffc2cb}

/* bosses */
.boss{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.boss-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.boss h3{margin:8px 0 0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;letter-spacing:-.01em}
.days{text-align:right;flex-shrink:0}
.days strong{font-family:var(--display);font-size:44px;font-weight:800;line-height:.9;display:block;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.days small{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.hp{display:flex;flex-direction:column;gap:7px}
.hp .label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums}
.hp .bar{height:12px}
.hp .bar i{background:linear-gradient(90deg,#ff8a9a,#ffd06b);box-shadow:0 0 12px rgba(255,160,140,.7)}
.note{font-size:13px;color:var(--faint)}

.rest{padding:30px 24px;display:flex;flex-direction:column;gap:14px}
.rest h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,40px);margin:0;line-height:1.05;letter-spacing:-.02em}
.rest p{margin:0;color:var(--dim);max-width:52ch}

/* floating tab bar */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:2px;padding:5px;border-radius:999px}
.nav button{border:0;background:transparent;padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .25s,color .25s}
.nav button[aria-current="page"]{background:rgba(255,255,255,.22);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.nav svg{width:21px;height:21px}
.fab{position:fixed;right:max(16px,calc(50% - 280px + 16px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:5;width:58px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff}
.fab svg{width:24px;height:24px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(0,0,20,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet{width:100%;max-width:520px;padding:24px 22px;display:flex;flex-direction:column;gap:14px;margin-bottom:env(safe-area-inset-bottom,0px);max-height:90vh;overflow:auto;border-radius:38px;background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.1))}
.sheet h2{margin:0;font-family:var(--display);font-weight:800;font-size:24px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--dim);padding-inline:4px}
.field input,.field select{width:100%;padding:13px 16px;border-radius:18px;border:0;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 2px rgba(0,0,0,.15),inset 0 0 0 1px rgba(255,255,255,.14);min-width:0}
.field input::placeholder{color:var(--faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:0;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);padding:9px 14px;border-radius:999px;font-size:13.5px;font-weight:700}
.seg button[aria-pressed="true"]{background:#fff;color:#10122e}
.err{color:#ffd0d6;font-size:13.5px;margin:0;font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:20;padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}

.muted{color:var(--dim)}
.cal{padding:16px 12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 4px}
.calt{text-align:center;display:flex;flex-direction:column}
.calt h2{margin:0;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;line-height:1.1}
.calt small{font-size:12px;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wd{text-align:center;font-size:11px;font-weight:800;color:var(--faint);padding-bottom:4px}
.day{position:relative;border:0;background:transparent;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 6px;min-height:52px;color:var(--fg);font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;transition:background .2s}
.day .n{width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.day.out{opacity:.32}
.day.past:not(.today) .n{color:var(--dim)}
.day.today .n{background:#fff;color:#10122e;box-shadow:0 0 14px rgba(255,255,255,.6)}
.day.exam .n{box-shadow:0 0 0 2px var(--crit),0 0 14px rgba(255,125,142,.7)}
.day.today.exam .n{box-shadow:0 0 0 2px var(--crit),0 0 14px rgba(255,255,255,.6)}
.day[aria-pressed="true"]{background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.14)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;box-shadow:0 0 6px currentColor}
.more{font-size:9.5px;color:var(--dim);font-weight:800;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 6px 0;border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;font-weight:700;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%}
.legend i.tring{background:transparent;box-shadow:0 0 0 2px var(--crit)}
.ask{display:flex;flex-direction:column;gap:12px;padding-bottom:110px}
.askbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.modes button{padding:7px 14px}
.btn.mini{min-height:34px;padding:6px 12px;font-size:12.5px}
.msgs{display:flex;flex-direction:column;gap:10px;min-width:0}
.amsg{max-width:88%;padding:11px 15px;border-radius:22px;font-size:15px;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.amsg p{margin:0}.amsg p+p,.amsg p+ul,.amsg p+ol,.amsg ul+p,.amsg ol+p{margin-top:8px}
.amsg ul,.amsg ol{margin:6px 0;padding-left:20px}.amsg li+li{margin-top:3px}
.amsg code{font-family:ui-monospace,Menlo,monospace;font-size:.88em;background:rgba(255,255,255,.12);padding:1px 5px;border-radius:6px}
.amsg pre{margin:8px 0;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.28);overflow-x:auto}.amsg pre code{background:none;padding:0}
.amsg.me{align-self:flex-end;background:rgba(255,255,255,.92);color:#10122e;border-bottom-right-radius:8px;box-shadow:0 10px 24px -14px rgba(0,0,0,.5)}

<script>
/* GRADE OS sync: stores everything in one JSON file in a private GitHub repo. */
window.GHStore=(()=>{
  const OWNER='iPhone-walls', REPO='grade-os', BRANCH='data', PATH='data.json';
  const GH='https://api.github.com/repos/'+OWNER+'/'+REPO;
  const API=GH+'/contents/'+PATH;
  const RAW='https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BRANCH+'/'+PATH;
  const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
            set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
  const EMPTY=()=>({tasks:{},exams:{},state:{}});
  let token=ls.get('gos-token'), local=false; ls.set('gos-mode',null);
  let data=EMPTY(), sha=null, pending=[], saving=false, timer=null, poller=null, status='idle';
  const listeners=new Set();
  try{const c=JSON.parse(ls.get('gos-cache')||'null'); if(c&&c.data){data={...EMPTY(),...c.data}; sha=c.sha||null}}catch(e){}

  const b64e=s=>{const by=new TextEncoder().encode(s);let bin='';for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin)};
  const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g,'')),c=>c.charCodeAt(0)));
  const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
  const persist=()=>ls.set('gos-cache',JSON.stringify({data,sha}));
  const emit=()=>{persist();listeners.forEach(f=>{try{f()}catch(e){console.error(e)}})};
  const hdr=t=>({'Authorization':'Bearer '+(t||token),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
  const err=(code,msg)=>{const e=new Error(msg||code);e.code=code;return e};

  function setStatus(s){
    status=s;
    const el=document.getElementById('syncLine'); if(!el) return;
    const txt={view:'Showing your list. Add your sync key to save changes.',needkey:'Not saved yet. Add your sync key.',ok:'Synced with GitHub',offline:'Offline. Changes will sync when you’re back online.',saving:'Saving…',local:'Saved on this device only',idle:'Connecting…'}[s]||'';
    el.querySelector('[data-sync-text]').textContent=txt;
    el.dataset.state=s;
    const kb=el.querySelector('[data-act]'); if(kb){const nk=(s==='view'||s==='needkey');kb.dataset.act=nk?'addkey':'disconnect';kb.textContent=nk?'Add key':'Remove key'}
  }
  async function fetchPublic(){
    let r;
    try{r=await fetch(RAW+'?t='+Date.now(),{cache:'no-store'})}catch(e){throw err('net')}
    if(!r.ok) throw err('net');
    const d=await r.json(); return {...EMPTY(),...d};
  }
  async function pullPublic(){
    if(token||local||pending.length) return;
    try{const d=await fetchPublic(); if(JSON.stringify(d)!==JSON.stringify(data)){data=d;emit()} setStatus('view')}
    catch(e){setStatus('offline')}
  }
  async function fetchRemote(){
    let r;
    try{r=await fetch(API+'?ref='+BRANCH+'&t='+Date.now(),{headers:hdr(),cache:'no-store'})}catch(e){throw err('net')}
    if(r.status===404) return {data:EMPTY(),sha:null};
    if(r.status===401) throw err('auth','That key didn’t work. Copy it again from GitHub, the whole thing.');
    if(!r.ok) throw err('net','GitHub didn’t answer. Try again in a minute.');
    const j=await r.json(); let d=EMPTY();
    try{d={...d,...JSON.parse(b64d(j.content))}}catch(e){}
    return {data:d,sha:j.sha};
  }
  function authFail(){
    token=null; ls.set('gos-token',null);
    setStatus(pending.length?'needkey':'view');
    window.dispatchEvent(new CustomEvent('gos-auth'));
  }
  async function pull(){
    if(local||!token||pending.length||saving) return;
    try{const r=await fetchRemote(); if(r.sha!==sha){data=r.data;sha=r.sha;emit()} setStatus('ok')}
    catch(e){e.code==='auth'?authFail():setStatus('offline')}
  }
  function mutate(fn){
    fn(data); emit();
    if(local) return Promise.resolve();
    if(!token){pending.push(fn);setStatus('needkey');window.dispatchEvent(new CustomEvent('gos-needkey'));return Promise.resolve()}
    pending.push(fn); setStatus('saving');
    clearTimeout(timer); timer=setTimeout(flush,500);
    return Promise.resolve();
  }
  async function flush(){
    if(saving||!pending.length||!token) return;
    saving=true;
    const batch=pending.splice(0);
    let tries=0, ok=false;
    while(true){
      try{
        const body={message:'GRADE OS update',branch:BRANCH,content:b64e(JSON.stringify(data,null,1))};
        if(sha) body.sha=sha;
        let r;
        try{r=await fetch(API,{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw err('net')}
        if(r.ok){const j=await r.json(); sha=j.content.sha; persist(); ok=true; break}
        if(r.status===401) throw err('auth');
        if((r.status===409||r.status===422)&&tries<3){
          tries++;
          const fresh=await fetchRemote(); data=fresh.data; sha=fresh.sha;
          batch.forEach(f=>f(data)); pending.forEach(f=>f(data)); emit();
          continue;
        }
        throw err('net');
      }catch(e){
        if(e.code==='auth'){authFail();break}
        pending.unshift(...batch); setStatus('offline');
        clearTimeout(timer); timer=setTimeout(flush,15000);
        break;
      }
    }
    saving=false;
    if(ok){ if(pending.length){clearTimeout(timer);timer=setTimeout(flush,300)} else setStatus('ok') }
  }
  const snapCol=n=>{const c=data[n]||{};const docs=Object.keys(c).sort().map(id=>({id,exists:true,metadata:{},data:()=>clone(c[id])}));return{docs,size:docs.length,empty:!docs.length,metadata:{}}};
  const api={
    collection(n){return{
      path:n,
      onSnapshot(next){const f=()=>next(snapCol(n));listeners.add(f);setTimeout(f,0);return()=>listeners.delete(f)},
      async get(){return snapCol(n)},
      async add(doc){const id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const v=clone(doc);await mutate(d=>{(d[n]=d[n]||{})[id]=clone(v)});return api.doc(n+'/'+id)},
      doc(id){return api.doc(n+'/'+id)}
    }},
    doc(p){const i=p.lastIndexOf('/'),c=p.slice(0,i),id=p.slice(i+1);
      const snap=()=>{const v=(data[c]||{})[id];return{id,exists:!!v,metadata:{},data:()=>clone(v)}};
      return{id,path:p,
        onSnapshot(next){const f=()=>next(snap());listeners.add(f);setTimeout(f,0);return()=>listeners.delete(f)},
        async get(){return snap()},
        set(v){const val=clone(v);return mutate(d=>{(d[c]=d[c]||{})[id]=clone(val)})},
        update(v){const val=clone(v);return mutate(d=>{const cur=(d[c]=d[c]||{})[id];if(cur)Object.assign(cur,clone(val))})},
        delete(){return mutate(d=>{if(d[c])delete d[c][id]})}
      }}
  };
  return {
    mode:()=>token?'gh':local?'local':'view',
    async connect(tok){
      tok=String(tok||'').trim();
      if(!tok) throw err('input','Paste your sync key first.');
      let r;
      try{r=await fetch(GH,{headers:hdr(tok),cache:'no-store'})}catch(e){throw err('net','GitHub didn’t answer. Check your connection and try again.')}
      if(r.status===401) throw err('auth','That key didn’t work. Copy it again from GitHub, the whole thing.');
      if(r.status===403||r.status===404) throw err('access','The key works, but it can’t see grade-os. Edit the key on GitHub: give it that repo with Contents: Read and write.');
      if(!r.ok) throw err('net','GitHub didn’t answer. Try again in a minute.');
      const prev=token; token=tok;
      let f; try{f=await fetchRemote()}catch(e){token=prev;throw e}
      ls.set('gos-token',tok); local=false; ls.set('gos-mode',null);
      data=f.data; sha=f.sha;
      pending.forEach(fn=>fn(data)); emit();
      if(pending.length){setStatus('saving');setTimeout(flush,100)} else setStatus('ok');
    },
    useLocal(){local=true;ls.set('gos-mode','local')},
    disconnect(){token=null;local=false;ls.set('gos-token',null);ls.set('gos-mode',null);setStatus('view');pullPublic()},
    open(){
      setStatus(local?'local':token?'idle':'view');
      if(!local){
        const tickPull=()=>token?pull():pullPublic();
        tickPull();
        clearInterval(poller);
        poller=setInterval(()=>{if(!document.hidden)tickPull()},45000);
        document.addEventListener('visibilitychange',()=>{if(!document.hidden)tickPull()});
        window.addEventListener('online',()=>{token&&pending.length?flush():tickPull()});
      }
      return api;
    },
    refreshStatus(){setStatus(local?'local':(!token&&!pending.length)?'view':status)}
  };
})();
</script>
<script>
(()=>{
const COURSES={
  ITM200:{name:'ITM200',full:'Programming',color:'var(--c-itm200)',kind:'school'},
  ITM301:{name:'ITM301',full:'IT Infrastructure',color:'var(--c-itm301)',kind:'school'},
  PCS181:{name:'PCS181',full:'Astronomy',color:'var(--c-pcs181)',kind:'school'},
  ECN503:{name:'ECN503',full:'Economic Dev.',color:'var(--c-ecn503)',kind:'school'},
  BIZ:{name:'Business',full:'Wallpapers',color:'var(--c-biz)',kind:'biz'},
  LIFE:{name:'Life',full:'Admin',color:'var(--c-life)',kind:'life'}
};
const KIND_FACTOR={school:1,biz:.8,life:1.15};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1), calSel=null;
let db=null, tasks=[], exams=[], st={xp:0,streak:0,lastDay:'',snoozed:{}}, loaded={t:false,e:false};
let tab='now', showAnyway=false, timer=null, tick=null, confirmDel=null;
try{const t=JSON.parse(localStorage.getItem('gos-timer')||'null'); if(t&&t.endsAt>Date.now()-3600e3) timer=t;}catch(e){}
const saveTimer=()=>{try{localStorage.setItem('gos-timer',JSON.stringify(timer))}catch(e){}};

/* ---------- time helpers ---------- */
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const fmtTime=d=>new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const fmtDay=d=>new Date(d).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'});
function rel(iso){
  if(!iso) return 'No date';
  const d=new Date(iso), now=new Date(), h=(d-now)/36e5;
  if(h<0) return 'Overdue · '+fmtDay(d);
  const tk=dayKey(now), dk=dayKey(d), tm=dayKey(new Date(now.getTime()+864e5));
  if(dk===tk) return h<3?'in '+Math.max(1,Math.round(h*60))+' min':'Today '+fmtTime(d);
  if(dk===tm) return 'Tomorrow '+fmtTime(d);
  if(h<24*6) return new Date(d).toLocaleDateString('en-CA',{weekday:'long'})+' '+fmtTime(d);
  return fmtDay(d);
}
const daysUntil=iso=>Math.ceil((new Date(dayKey(iso)+'T00:00:00')-new Date(dayKey(new Date())+'T00:00:00'))/864e5);
function urgencyPill(iso){
  if(!iso) return '';
  const h=(new Date(iso)-Date.now())/36e5;
  if(h<0) return '<span class="pill crit">Overdue</span>';
  if(h<36) return '<span class="pill crit">Due soon</span>';
  if(h<24*4) return '<span class="pill warn">This week</span>';
  return '';
}

/* ---------- priority engine ---------- */
function score(t){
  const kind=(COURSES[t.course]||COURSES.LIFE).kind;
  const w=1+(Number(t.weight)||0)/5;
  if(!t.due) return .12*KIND_FACTOR[kind];
  const h=(new Date(t.due)-Date.now())/36e5;
  if(h<0) return 50+w;
  return 48/(h+6)*w*KIND_FACTOR[kind];
}
function queue(){
  const now=Date.now(), today=dayKey(now), sn=st.snoozed||{};
  const items=tasks.filter(t=>t.status!=='done' && !(sn[t.id]>now)).map(t=>({...t,virtual:false,s:score(t)}));
  exams.forEach(e=>{
    const h=(new Date(e.date)-now)/36e5, d=h/24;
    if(h<=0||d>14||e.lastPrep===today) return;
    const id='prep:'+e.id; if(sn[id]>now) return;
    const w=1+(Number(e.weight)||0)/5;
    items.push({id,virtual:true,exam:e,course:e.course,title:e.name+' prep',
      detail:'Practice questions on the newest topics. Star anything you get wrong and redo it at the end.',
      mins:40,due:e.date,weight:e.weight,s:48/(h/2+6)*w*.4});
  });
  return items.sort((a,b)=>b.s-a.s);
}
function reason(t){
  if(t.virtual) return `Midterm in ${daysUntil(t.exam.date)} days, worth ${t.weight}%. One prep block a day keeps it from turning into a cram.`;
  const h=t.due?(new Date(t.due)-Date.now())/36e5:null;
  const k=(COURSES[t.course]||COURSES.LIFE).kind;
  if(h!==null&&h<0) return 'This slipped past its deadline. Knock it out first, then the rest of the list opens up.';
  if(h!==null&&h<36) return 'Closest real deadline on your list. Nothing else gets touched until this moves.';
  if(k==='biz') return 'School is on track right now, so this is the best use of the next block. Keep it to one set.';
  if(t.weight>=10) return `Worth ${t.weight}% of your grade. Getting ahead on this beats anything else right now.`;
  return 'Highest priority on your list right now based on deadline and weight.';
}

/* ---------- state writes ---------- */
async function saveState(patch){
  st={...st,...patch};
  try{await db.doc('state/me').set(st)}catch(e){toast('Could not save. Check your connection.')}
}
function nextRepeat(t){
  const [hh,mm]=(t.repeatTime||'20:00').split(':').map(Number);
  const base=new Date();
  for(let i=1;i<=8;i++){const d=new Date(base);d.setDate(d.getDate()+i);if((t.repeat||[]).includes(d.getDay())){d.setHours(hh,mm,0,0);return d.toISOString()}}
  return null;
}
async function complete(item){
  const mins=item.mins||30, now=new Date(), today=dayKey(now);
  try{
    if(item.virtual){
      await db.doc('exams/'+item.exam.id).update({done:(item.exam.done||0)+1,lastPrep:today});
    }else if(item.repeat&&item.repeat.length){
      await db.doc('tasks/'+item.id).update({due:nextRepeat(item),lastDone:now.toISOString()});
    }else{
      await db.doc('tasks/'+item.id).update({status:'done',doneAt:now.toISOString()});
    }
  }catch(e){toast('Could not save that. Try again.');return}
  const gain=10+Math.round(mins/15)*10;
  const y=dayKey(new Date(now.getTime()-864e5));
  const streak=st.lastDay===today?st.streak:(st.lastDay===y?(st.streak||0)+1:1);
  timer=null;saveTimer();
  await saveState({xp:(st.xp||0)+gain,streak,lastDay:today});
  toast('+'+gain+' XP. Next one’s ready.');
}
async function snooze(item){
  const sn={...(st.snoozed||{})}, now=Date.now();
  Object.keys(sn).forEach(k=>{if(sn[k]<now) delete sn[k]});
  sn[item.id]=now+2*36e5;
  timer=null;saveTimer();
  await saveState({snoozed:sn});
  toast('Parked for 2 hours.');
}

/* ---------- render ---------- */
function statsHTML(){

  return `<span class="chip frost" title="Days in a row with at least one block done"><svg width="14" height="14" viewBox="0 0 24 24" fill="var(--warn)"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg>${st.streak||0}</span>
  <div class="lvl frost"><small><span>Lv ${lvl}</span><span>${into}/200</span></small><div class="bar"><i style="width:${into/2}%"></i></div></div>`;
}
function courseTag(c){const k=COURSES[c]||COURSES.LIFE;return `<span class="course" style="color:${k.color}"><b></b>${esc(k.name)}</span>`}

    <div class="meta">
      <div class="frost"><small>Block</small><strong>${mins} min</strong></div>
      <div class="frost"><small>Stop at</small><strong>${fmtTime(stopAt)}</strong></div>

function rowHTML(t,withActions){
  const k=COURSES[t.course]||COURSES.LIFE;
  const bits=[esc(k.name), esc(rel(t.due))];
  if(t.weight) bits.push(esc(t.weight)+'%');
  if(t.repeat&&t.repeat.length) bits.push('repeats');
  const del=withActions&&!t.virtual?(confirmDel===t.id
    ?`<button class="btn ghost small" data-act="del" data-id="${esc(t.id)}" style="color:var(--crit)">Delete</button>`
    :`<button class="icon-btn danger" data-act="askdel" data-id="${esc(t.id)}" aria-label="Delete ${esc(t.title)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>`):'';
  const check=withActions&&!t.virtual?`<button class="icon-btn ${t.status==='done'?'on':''}" data-act="toggle" data-id="${esc(t.id)}" aria-label="${t.status==='done'?'Mark not done':'Mark done'}: ${esc(t.title)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5 9-10"/></svg></button>`:'';
  return `<div class="row frost" style="${t.status==='done'?'opacity:.55':''}"><span class="stripe" style="background:${k.color};color:${k.color}"></span>
    <div style="min-width:0"><div class="t">${esc(t.title)}</div><div class="s">${bits.map(b=>`<span>${b}</span>`).join('<span>·</span>')}</div></div>
    <div class="end">${t.status==='done'?'':urgencyPill(t.due)}${check}${del}</div></div>`;
}
function renderPlan(){
  const now=Date.now(), today=dayKey(now);
  const open=tasks.filter(t=>t.status!=='done').sort((a,b)=>(a.due?new Date(a.due):Infinity)-(b.due?new Date(b.due):Infinity));
  const groups=[['Overdue',[]],['Today',[]],['Next 7 days',[]],['Later',[]],['No date',[]]];
  open.forEach(t=>{
    if(!t.due) return groups[4][1].push(t);
    const d=new Date(t.due);
    if(d<now) groups[0][1].push(t); else if(dayKey(d)===today) groups[1][1].push(t);
    else if(d-now<7*864e5) groups[2][1].push(t); else groups[3][1].push(t);
  });
  const done=tasks.filter(t=>t.status==='done').sort((a,b)=>new Date(b.doneAt||0)-new Date(a.doneAt||0)).slice(0,8);
  let html=groups.filter(g=>g[1].length).map(([n,l])=>`<section class="section"><div class="shead"><h2>${n}</h2><span>${l.length}</span></div>${l.map(t=>rowHTML(t,true)).join('')}</section>`).join('');
  if(!open.length) html=`<section class="glass rest"><h1>List’s empty.</h1><p>Add a deadline with the + button and it slots into the queue automatically.</p></section>`;
  if(done.length) html+=`<section class="section"><div class="shead"><h2>Recently done</h2><span>tap ✓ to reopen</span></div>${done.map(t=>rowHTML(t,true)).join('')}</section>`;
  return html;
}

    list.map(e=>{
      const k=COURSES[e.course]||COURSES.LIFE, d=daysUntil(e.date), goal=e.goal||6, done=Math.min(e.done||0,goal);

function renderCal(){

  const byDay={};
  const put=(k,x)=>{(byDay[k]=byDay[k]||[]).push(x)};
  tasks.forEach(t=>{if(t.due) put(dayKey(t.due),{kind:'task',t})});
  exams.forEach(e=>put(dayKey(e.date),{kind:'exam',e}));
  const first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  const weeks=Math.ceil((first.getDay()+new Date(y,m+1,0).getDate())/7);
  let cells='';
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i), k=dayKey(d), items=byDay[k]||[];
    const hasExam=items.some(x=>x.kind==='exam');

    const cols=[...new Set(items.filter(x=>x.kind==='exam'||x.t.status!=='done').map(x=>(COURSES[x.kind==='exam'?x.e.course:x.t.course]||COURSES.LIFE).color))].slice(0,3);
    const cls=['day',d.getMonth()!==m?'out':'',k===today?'today':'',hasExam?'exam':'',k<today?'past':''].join(' ');
    const label=d.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'})+(items.length?`, ${items.length} item${items.length>1?'s':''}`:'')+(hasExam?', test day':'');
    cells+=`<button class="${cls}" data-day="${k}" aria-pressed="${k===calSel}" aria-label="${esc(label)}"><span class="n">${d.getDate()}</span><span class="dots">${cols.map(c=>`<i style="background:${c}"></i>`).join('')}</span>${open.length>3?`<span class="more">+${open.length-3}</span>`:''}</button>`;
  }
  const wd=['S','M','T','W','T','F','S'].map(x=>`<span class="wd">${x}</span>`).join('');
  const sel=(byDay[calSel]||[]).sort((a,b)=>(a.kind==='exam'?-1:0)-(b.kind==='exam'?-1:0));
  const selDate=new Date(calSel+'T12:00:00');
  const agenda=sel.length?sel.map(x=>{
    if(x.kind==='task') return rowHTML(x.t,true);
    const e=x.e,k=COURSES[e.course]||COURSES.LIFE,dd=daysUntil(e.date);
    return `<div class="row frost examrow"><span class="stripe" style="background:var(--crit);color:var(--crit)"></span><div style="min-width:0"><div class="t">${esc(e.name)}</div><div class="s"><span>${esc(k.name)}</span><span>·</span><span>${esc(e.weight)}% of grade</span>${e.tentative?'<span>·</span><span>date not final</span>':''}</div></div><div class="end"><span class="pill ${dd<=7?'crit':'warn'}">${dd<0?'Done':dd===0?'Today':dd+' days'}</span></div></div>`;
  }).join(''):`<div class="frost emptyday">Nothing due. ${calSel>=today?'Tap + to add something for this day.':''}</div>`;
  const legend=Object.keys(COURSES).map(c=>`<span><i style="background:${COURSES[c].color}"></i>${esc(COURSES[c].name)}</span>`).join('')+'<span><i class="tring"></i>Test day</span>';
  return `<section class="glass cal">
    <div class="calhead">
      <button class="icon-btn" data-act="calprev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="calt"><h2>${calMonth.toLocaleDateString('en-CA',{month:'long'})}</h2><small>${y}</small></div>
      <button class="icon-btn" data-act="calnext" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="grid7">${wd}${cells}</div>
    <div class="legend">${legend}</div>
  </section>
  <section class="section"><div class="shead"><h2>${esc(selDate.toLocaleDateString('en-CA',{weekday:'long',month:'short',day:'numeric'}))}</h2>${calSel!==today||calMonth.getMonth()!==now.getMonth()?'<button class="btn ghost small" data-act="caltoday" style="min-height:34px;padding:6px 14px;font-size:13px">Today</button>':`<span>${sel.length} item${sel.length===1?'':'s'}</span>`}</div>${agenda}</section>`;

function paintTimer(){
  clearInterval(tick);
  const box=$('#timerBox'); if(!box||!timer) return;
  const step=()=>{
    const left=timer.endsAt-Date.now(), total=timer.mins*6e4;
    const c=$('#clock'), f=$('#trackFill'); if(!c) return clearInterval(tick);
    const l=Math.max(0,left), m=Math.floor(l/6e4), s=Math.floor(l%6e4/1e3);
    c.textContent=left>0?`${m}:${String(s).padStart(2,'0')}`:'Time';
    c.classList.toggle('ending',left<5*6e4);
    f.style.width=Math.min(100,(1-l/total)*100)+'%';
    if(left<=0){clearInterval(tick);}
  };
  step(); tick=setInterval(step,1000);
}

function md(src){
  const parts=String(src||'').split(/```/);
  return parts.map((p,i)=>{
    if(i%2) return `<pre><code>${esc(p.replace(/^[a-z]*\n/i,''))}</code></pre>`;
    const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
    const out=[]; let list=null;
    p.split('\n').forEach(line=>{
      const m=line.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/);
      if(m){ if(!list){list=/^\s*\d/.test(line)?'ol':'ul';out.push(`<${list}>`)} out.push(`<li>${inline(m[1])}</li>`); return }
      if(list){out.push(`</${list}>`);list=null}
      if(line.trim()) out.push(`<p>${inline(line)}</p>`);
    });
    if(list) out.push(`</${list}>`);
    return out.join('');
  }).join('');
}

const COURSE_ENUM=['ITM200','ITM301','PCS181','ECN503','BIZ','LIFE'];
const AI_TOOLS=[
  {name:'add_task',description:'Add a task or deadline to his list.',input_schema:{type:'object',properties:{title:{type:'string'},course:{type:'string',enum:COURSE_ENUM},due:{type:'string',description:'ISO 8601 date-time with offset, e.g. 2026-10-14T23:59:00-04:00'},weight:{type:'number',description:'Percent of final grade, 0 if unknown'},mins:{type:'number',description:'Rough minutes needed'},detail:{type:'string',description:'One short line on what to do'}},required:['title','course']}},
  {name:'add_test',description:'Add a test, quiz, midterm or exam. Prep blocks appear automatically two weeks out.',input_schema:{type:'object',properties:{name:{type:'string'},course:{type:'string',enum:COURSE_ENUM},date:{type:'string',description:'ISO 8601 date-time with offset'},weight:{type:'number'},tentative:{type:'boolean'},note:{type:'string'}},required:['name','course','date']}},
  {name:'complete_task',description:'Mark a task done by its id.',input_schema:{type:'object',properties:{task_id:{type:'string'}},required:['task_id']}},
  {name:'update_task',description:'Change a task: due date, weight, title, detail or minutes.',input_schema:{type:'object',properties:{task_id:{type:'string'},title:{type:'string'},due:{type:'string'},weight:{type:'number'},mins:{type:'number'},detail:{type:'string'}},required:['task_id']}}
];
const fmtShort=iso=>{try{return new Date(iso).toLocaleDateString('en-CA',{month:'short',day:'numeric'})}catch(e){return ''}};
async function runTool(u){
  const i=u.input||{};
  try{
    if(u.name==='add_task'){
      if(!i.title) return {out:'Missing title.'};
      const doc={title:String(i.title),course:COURSE_ENUM.includes(i.course)?i.course:'LIFE',due:i.due?new Date(i.due).toISOString():null,weight:Number(i.weight)||0,mins:Math.max(5,Number(i.mins)||40),status:'todo',createdAt:new Date().toISOString()};
      if(i.detail) doc.detail=String(i.detail);
      if(doc.course==='ITM200'||doc.course==='ITM301') doc.noAI=true;
      const ref=await db.collection('tasks').add(doc);
      return {out:'Added with id '+ref.id, chip:`Added ${doc.title}${doc.due?' · '+fmtShort(doc.due):''}`};
    }
    if(u.name==='add_test'){
      const id=(i.course||'x').toLowerCase()+'-'+Date.now().toString(36);
      const doc={course:COURSE_ENUM.includes(i.course)?i.course:'LIFE',name:String(i.name),date:new Date(i.date).toISOString(),weight:Number(i.weight)||0,goal:6,done:0,lastPrep:'',tentative:!!i.tentative};
      if(i.note) doc.note=String(i.note);
      await db.doc('exams/'+id).set(doc);
      return {out:'Test added with id '+id, chip:`Added test ${doc.name} · ${fmtShort(doc.date)}`};
    }
    if(u.name==='complete_task'){
      const t=tasks.find(x=>x.id===i.task_id); if(!t) return {out:'No task with that id.'};
      await db.doc('tasks/'+t.id).update({status:'done',doneAt:new Date().toISOString()});
      return {out:'Marked done.', chip:`Done: ${t.title}`};
    }
    if(u.name==='update_task'){
      const t=tasks.find(x=>x.id===i.task_id); if(!t) return {out:'No task with that id.'};
      const patch={}; ['title','detail'].forEach(k=>{if(i[k]!=null) patch[k]=String(i[k])});
      ['weight','mins'].forEach(k=>{if(i[k]!=null) patch[k]=Number(i[k])||0});
      if(i.due) patch.due=new Date(i.due).toISOString();
      await db.doc('tasks/'+t.id).update(patch);
      return {out:'Updated.', chip:`Updated ${patch.title||t.title}`};
    }
  }catch(e){return {out:'Failed: '+(e.message||e)}}
  return {out:'Unknown tool.'};
}
function trimmedMsgs(){
  let m=apiMsgs.slice(-24);
  while(m.length&&!(m[0].role==='user'&&!(Array.isArray(m[0].content)&&m[0].content.some(c=>c.type==='tool_result')))) m=m.slice(1);
  const cut=m.length-6;
  return m.map((x,idx)=>{
    if(idx>=cut||!Array.isArray(x.content)) return x;
    return {...x,content:x.content.map(c=>(c.type==='image'||c.type==='document')?{type:'text',text:'[file shared earlier]'}:c)};
  });
}
async function callClaude(){
  for(let round=0;round<6;round++){
    let r;
    try{
      r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':aiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:AI_MODELS[aiMode].id,max_tokens:1600,system:aiSystem(),tools:AI_TOOLS,messages:trimmedMsgs()})});
    }catch(e){throw new Error('Couldn’t reach Claude. Check your connection and try again.')}
    if(!r.ok){
      let msg=''; try{msg=(await r.json()).error.message||''}catch(e){}
      if(r.status===401) throw Object.assign(new Error('That AI key didn’t work. Remove it in settings and paste it again.'),{badKey:true});
      if(/credit balance/i.test(msg)) throw new Error('Your Claude API credit is empty. Add some at console.anthropic.com → Billing.');
      if(r.status===429) throw new Error('Too many messages at once. Wait a minute and try again.');
      if(r.status===529||r.status>=500) throw new Error('Claude is busy right now. Try again in a minute.');
      throw new Error('Claude couldn’t answer that ('+r.status+'). '+msg.slice(0,140));
    }
    const j=await r.json();
    apiMsgs.push({role:'assistant',content:j.content});
    const text=j.content.filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
    const uses=j.content.filter(c=>c.type==='tool_use');
    if(text) addMsg({role:'assistant',text});
    if(j.stop_reason!=='tool_use'||!uses.length) return;
    const results=[];
    for(const u of uses){const res=await runTool(u); results.push({type:'tool_result',tool_use_id:u.id,content:res.out}); if(res.chip) addMsg({role:'action',text:res.chip})}
    apiMsgs.push({role:'user',content:results});
  }
}

function shrinkImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const max=1568, s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const data=c.toDataURL('image/jpeg',.86);
      const t=document.createElement('canvas'), ts=Math.min(1,160/Math.max(img.width,img.height)); t.width=Math.round(img.width*ts); t.height=Math.round(img.height*ts);
      t.getContext('2d').drawImage(img,0,0,t.width,t.height);
      URL.revokeObjectURL(url);
      res({name:file.name||'screenshot',block:{type:'image',source:{type:'base64',media_type:'image/jpeg',data:data.split(',')[1]}},thumb:t.toDataURL('image/jpeg',.7)});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Couldn’t read that image.'))};
    img.src=url;
  });
}
const readAs=(file,how)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);how==='text'?r.readAsText(file):r.readAsDataURL(file)});
async function addFiles(list){

      else if(f.type==='application/pdf'){
        if(f.size>20e6){toast('That PDF is over 20 MB. Send a smaller one.');continue}
        const d=await readAs(f,'url'); pendingFiles.push({name:f.name,block:{type:'document',source:{type:'base64',media_type:'application/pdf',data:String(d).split(',')[1]}}});
      }else{
        const txt=await readAs(f,'text'); pendingFiles.push({name:f.name,block:{type:'text',text:`File "${f.name}":\n${String(txt).slice(0,60000)}`}});
      }
    }catch(e){toast(e.message||'Couldn’t read that file.')}
  }
  const a=document.getElementById('atts'); if(a) a.innerHTML=attsHTML();
}
async function sendAsk(text){

  aiBusy=false; if(sb) sb.disabled=false; paintMsgs();
}

  const btn=document.getElementById('bgBtn'), box=document.getElementById('swatches'), row=document.getElementById('swatchRow');
  const apply=k=>{cur=k;const v=TH[k],s=document.body.style;document.body.dataset.bg=k;
    ['--base','--m1','--m2','--m3','--m4'].forEach((p,i)=>s.setProperty(p,v[i+1]));
    const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute('content',v[1]);
    try{localStorage.setItem('gos-bg',k)}catch(e){}
    row.innerHTML=Object.keys(TH).map(n=>{const x=TH[n];return `<button data-bg="${n}" aria-pressed="${n===cur}" aria-label="${x[0]} theme"><i style="background:radial-gradient(circle at 30% 25%,${x[3]},transparent 60%),radial-gradient(circle at 75% 70%,${x[4]},transparent 60%),linear-gradient(135deg,${x[2]},${x[5]})"></i><span>${x[0]}</span></button>`}).join('')};
  apply(cur);
  btn.addEventListener('click',e=>{e.stopPropagation();box.hidden=!box.hidden;window.GHStore&&window.GHStore.refreshStatus();btn.setAttribute('aria-expanded',String(!box.hidden))});
  box.addEventListener('click',e=>{const b=e.target.closest('[data-bg]');if(b){e.stopPropagation();apply(b.dataset.bg)}});
  document.addEventListener('click',e=>{if(!box.hidden&&!box.contains(e.target)){box.hidden=true;btn.setAttribute('aria-expanded','false')}});
})();
</script>
</body>
</html>
